services:
  mlflow:
    build:
      context: ./docker/mlflow
    working_dir: /app
    ports:
      - "5000:5000"
    volumes:
      - ./data/mlflow:/app
      - ./data/artifacts:/mlruns

  notebook:
    image: jupyter/scipy-notebook:python-3.11
    user: root
    command: >
      bash -lc "pip install --no-cache-dir mlflow==2.14.3 && start-notebook.py --IdentityProvider.token='' --ServerApp.password='' --ServerApp.disable_check_xsrf=True"
    environment:
      NB_UID: "1000"
      NB_GID: "1000"
      CHOWN_HOME: "yes"
      CHOWN_HOME_OPTS: "-R"
      MLFLOW_TRACKING_URI: http://mlflow:5000
      JUPYTER_TOKEN: ""
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
    depends_on:
      - mlflow
